<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TRS Performance = Contacto</title>
        <link rel="stylesheet" href="css/style.css">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
    </head>

    <body>
        
        <header>
            <nav class="navbar">
                <div class="logo">TRS Performance</div>
                <ul class="nav-links">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section class="contact-section">
                <h1>Contacto y consultas</h1>
                <p>Tenes dudas sobre una autoparte? Escribinos</p>

                <form id="contactForm" class="contact-form">
                    <div class="form-group">
                        <label for="nombre">Nombre y Apellido:</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Perez">
                    </div>

                    <div class="form-group">
                        <label for="email">Correo Electronico:</label>
                        <input type="email" id="email" name="email" placeholder="correo@ejemplo.com">
                    </div>

                    <div class="form-group">
                        <label for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribi tu consulta..."></textarea>
                    </div>

                    <button type="submit" class="submit-btn">Enviar Consulta</button>
                </form>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 TRS Performance. Trabajo Final Integrador</p>
        </footer>

        <script src="js/main.js"></script>

    </body>
</html>
